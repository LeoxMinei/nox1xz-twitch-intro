name: Render Nox1Xz intro
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install free dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Low-resolution smoke test
        run: python render.py --width 320 --height 180 --seconds 2 --output dist/smoke.mp4
      - name: Render final 15-second intro
        run: python render.py --output dist/Nox1Xz-intro.mp4
      - name: Verify video
        run: python validate.py dist/Nox1Xz-intro.mp4
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nox1Xz-intro
          path: dist/Nox1Xz-intro.mp4
          retention-days: 30
          if-no-files-found: error
